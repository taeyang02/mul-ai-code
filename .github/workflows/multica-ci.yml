# Multica shared CI — GitHub-hosted only (not for Zenon AI runtimes).
name: multica-ci

on:
  push:
    branches: [main, 'ci/**', 'fix/**', 'feat/**', 'review/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: read

concurrency:
  group: multica-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI_ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts
  BASE_URL: http://127.0.0.1:5173
  API_BASE: http://127.0.0.1:8080/api/v1

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Backend unit/integration tests
        id: test
        working-directory: backend
        run: |
          set -euo pipefail
          mkdir -p "$CI_ARTIFACT_DIR/job-status" "$CI_ARTIFACT_DIR/backend-test-results"
          if mvn -B test | tee "$CI_ARTIFACT_DIR/backend-test-results/mvn-test.log"; then
            echo "status=completed" >"$CI_ARTIFACT_DIR/job-status/backend.txt"
            echo "conclusion=success" >>"$CI_ARTIFACT_DIR/job-status/backend.txt"
          else
            echo "status=completed" >"$CI_ARTIFACT_DIR/job-status/backend.txt"
            echo "conclusion=failure" >>"$CI_ARTIFACT_DIR/job-status/backend.txt"
            echo "note=mvn test failed" >>"$CI_ARTIFACT_DIR/job-status/backend.txt"
            exit 1
          fi
      - name: Upload backend job status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-status-backend
          path: ci-artifacts/job-status/backend.txt
          if-no-files-found: warn
      - name: Upload surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire
          path: backend/target/surefire-reports/
          if-no-files-found: warn

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: typecheck / lint / unit / build
        id: fe
        run: |
          set +e
          mkdir -p "$CI_ARTIFACT_DIR/job-status"
          FAIL=0
          NOTES=""
          run_step() {
            local label="$1"; shift
            if npm run -s "$label" -- "$@" 2>/dev/null; then
              echo "ok $label"
            else
              # Fallback: try without -s for scripts that must exist
              if npm run "$label" -- "$@"; then
                echo "ok $label"
              else
                echo "fail $label"
                FAIL=1
                NOTES="${NOTES}; missing_or_failed:$label"
              fi
            fi
          }
          # Antigravity owns these script names — record honest failure if absent.
          npm run typecheck || { FAIL=1; NOTES="$NOTES;typecheck"; }
          npm run lint || { FAIL=1; NOTES="$NOTES;lint"; }
          npm run test:unit -- --run || { FAIL=1; NOTES="$NOTES;test:unit"; }
          npm run build || { FAIL=1; NOTES="$NOTES;build"; }
          if [[ "$FAIL" -eq 0 ]]; then
            echo "status=completed" >"$CI_ARTIFACT_DIR/job-status/frontend.txt"
            echo "conclusion=success" >>"$CI_ARTIFACT_DIR/job-status/frontend.txt"
          else
            echo "status=completed" >"$CI_ARTIFACT_DIR/job-status/frontend.txt"
            echo "conclusion=failure" >>"$CI_ARTIFACT_DIR/job-status/frontend.txt"
            echo "note=${NOTES}" >>"$CI_ARTIFACT_DIR/job-status/frontend.txt"
            exit 1
          fi
      - name: Upload frontend job status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-status-frontend
          path: ${{ github.workspace }}/ci-artifacts/job-status/frontend.txt
          if-no-files-found: warn

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always() && needs.backend.result != 'cancelled'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: thanhan
          POSTGRES_USER: thanhan
          POSTGRES_PASSWORD: thanhan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thanhan -d thanhan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Start backend against service Postgres
        run: |
          set -euo pipefail
          mkdir -p "$CI_ARTIFACT_DIR"
          export DATABASE_URL=jdbc:postgresql://127.0.0.1:5432/thanhan
          export DATABASE_USERNAME=thanhan
          export DATABASE_PASSWORD=thanhan
          export SPRING_DATASOURCE_URL=$DATABASE_URL
          export SPRING_DATASOURCE_USERNAME=$DATABASE_USERNAME
          export SPRING_DATASOURCE_PASSWORD=$DATABASE_PASSWORD
          (cd backend && nohup mvn -q -DskipTests spring-boot:run >"$CI_ARTIFACT_DIR/backend-run.log" 2>&1 &)
          ./scripts/ci/wait-for-url.sh http://127.0.0.1:8080/api/v1/site 120 200
      - name: Start Vite
        run: |
          set -euo pipefail
          cd frontend
          printf 'VITE_API_BASE_URL=/api/v1\nVITE_API_PROXY_TARGET=http://127.0.0.1:8080\n' > .env
          nohup npm run dev -- --host 127.0.0.1 --port 5173 >"$CI_ARTIFACT_DIR/frontend-run.log" 2>&1 &
          ../scripts/ci/wait-for-url.sh http://127.0.0.1:5173/ 90 200
      - name: Install Playwright Chromium (lockfile-aligned when @playwright/test present)
        working-directory: frontend
        run: |
          set +e
          if node -e "require.resolve('@playwright/test')"; then
            npx playwright install --with-deps chromium
          else
            echo "NOTE: @playwright/test not installed yet — Antigravity owns test:ci migration"
          fi
      - name: Run e2e / keyboard
        id: e2e
        working-directory: frontend
        env:
          BASE_URL: http://127.0.0.1:5173
          API_BASE: http://127.0.0.1:8080/api/v1
          CI_ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts
          SHOT_DIR: ${{ github.workspace }}/ci-artifacts/e2e
        run: |
          set +e
          mkdir -p "$CI_ARTIFACT_DIR/job-status" "$SHOT_DIR" "$CI_ARTIFACT_DIR/db-proof"
          NOTES=""
          # Preferred path (Antigravity): Playwright test:ci with workers=1
          if npm run test:ci; then
            echo "status=completed" >"$CI_ARTIFACT_DIR/job-status/e2e.txt"
            echo "conclusion=success" >>"$CI_ARTIFACT_DIR/job-status/e2e.txt"
            echo "note=test:ci" >>"$CI_ARTIFACT_DIR/job-status/e2e.txt"
            exit 0
          fi
          NOTES="test:ci_unavailable_or_failed"
          # Compatibility until test:ci lands — still real browser suites, not mocks
          KB=0; E2E=0
          npm run test:keyboard && KB=1 || NOTES="$NOTES;test:keyboard_failed"
          npm run test:e2e && E2E=1 || NOTES="$NOTES;test:e2e_failed"
          if [[ "$KB" -eq 1 && "$E2E" -eq 1 ]]; then
            echo "status=completed" >"$CI_ARTIFACT_DIR/job-status/e2e.txt"
            echo "conclusion=success" >>"$CI_ARTIFACT_DIR/job-status/e2e.txt"
            echo "note=legacy keyboard+e2e; test:ci pending Antigravity" >>"$CI_ARTIFACT_DIR/job-status/e2e.txt"
            exit 0
          fi
          echo "status=completed" >"$CI_ARTIFACT_DIR/job-status/e2e.txt"
          echo "conclusion=failure" >>"$CI_ARTIFACT_DIR/job-status/e2e.txt"
          echo "note=${NOTES}" >>"$CI_ARTIFACT_DIR/job-status/e2e.txt"
          exit 1
      - name: Install psql client
        if: always()
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: DB proof (migrations + quote id/marker)
        if: always()
        env:
          CI_ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: thanhan
          PGPASSWORD: thanhan
          PGDATABASE: thanhan
        run: |
          set -euo pipefail
          mkdir -p "$CI_ARTIFACT_DIR/db-proof"
          # Real evidence via scripts/ci/db-proof.sh — never hardcode SKIPPED/PASS.
          ./scripts/ci/db-proof.sh
      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-partial
          path: |
            ci-artifacts/
          if-no-files-found: warn

  artifacts:
    name: artifacts
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect job-status artifacts
        uses: actions/download-artifact@v4
        with:
          path: ci-artifacts/downloaded
          pattern: job-status-*
          merge-multiple: false
        continue-on-error: true
      - name: Collect e2e partial
        uses: actions/download-artifact@v4
        with:
          name: e2e-partial
          path: ci-artifacts
        continue-on-error: true
      - name: Collect surefire
        uses: actions/download-artifact@v4
        with:
          name: backend-surefire
          path: ci-artifacts/backend-test-results/surefire-reports
        continue-on-error: true
      - name: Normalize job-status files
        run: |
          mkdir -p ci-artifacts/job-status
          find ci-artifacts/downloaded -type f -name 'backend.txt' -exec cp {} ci-artifacts/job-status/backend.txt \; 2>/dev/null || true
          find ci-artifacts/downloaded -type f -name 'frontend.txt' -exec cp {} ci-artifacts/job-status/frontend.txt \; 2>/dev/null || true
          # e2e status may already be under ci-artifacts/job-status from e2e-partial
          for job in backend frontend e2e; do
            if [[ ! -f "ci-artifacts/job-status/${job}.txt" ]]; then
              echo "status=unknown" >"ci-artifacts/job-status/${job}.txt"
              echo "conclusion=NOT_RUN" >>"ci-artifacts/job-status/${job}.txt"
              echo "note=no status artifact downloaded" >>"ci-artifacts/job-status/${job}.txt"
            fi
          done
      - name: Publish schema-v1 bundle
        env:
          CI_ARTIFACT_DIR: ${{ github.workspace }}/ci-artifacts
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/ci/publish-artifacts.mjs
      - name: Upload multica-ci-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multica-ci-results
          path: ci-artifacts/
          if-no-files-found: warn
