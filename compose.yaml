services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: thanhan
      POSTGRES_USER: thanhan
      POSTGRES_PASSWORD: thanhan
    ports:
      - "5432:5432"
    volumes:
      - thanhan_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thanhan -d thanhan"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/thanhan
      DATABASE_USERNAME: thanhan
      DATABASE_PASSWORD: thanhan
      APP_CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  thanhan_pg:
